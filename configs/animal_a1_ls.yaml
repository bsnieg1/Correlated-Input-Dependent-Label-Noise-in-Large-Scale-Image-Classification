# A1: original ANIMAL-10N labels (real noise ~8%); method ls. Generated by make_animal_configs.py.
experiment: animal_a1_ls
method: ls
data:
  name: animal10n
  root: data/animal10n
  num_classes: 10
  val_fraction: 0.1
  split_seed: 0
  crop_padding: 4
model:
  name: resnet18_small
  in_channels: 3
head:
  name: linear
train:
  epochs: 100
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  amp: true
  eval_batch_size: 500
  label_smoothing: 0.1
