# S2: image-dependent pair noise, mean 30%, P(flip) ~ p_aux(partner | x); method het. Generated by make_mnist_configs.py.
experiment: mnist_s2_p30_het
method: het
data:
  name: mnist
  root: data
  num_classes: 10
  val_fraction: 0.1
  split_seed: 0
  noise:
    type: instance
    rate: 0.3
    pairs:
    - - 1
      - 7
    - - 4
      - 9
    - - 3
      - 8
    max_prob: 0.45
    aux_temperature: 4.0
    aux_epochs: 3
    aux_folds: 2
    seed: 0
model:
  name: small_cnn
  in_channels: 1
  feature_dim: 128
head:
  name: het
  num_factors: 3
  temperature: 1.0
  num_samples: 1000
train:
  epochs: 15
  batch_size: 128
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
