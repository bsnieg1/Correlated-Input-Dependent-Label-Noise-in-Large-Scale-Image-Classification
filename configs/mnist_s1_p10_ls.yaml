# S1: class-dependent pair noise 10%; method ls. Generated by make_mnist_configs.py.
experiment: mnist_s1_p10_ls
method: ls
data:
  name: mnist
  root: data
  num_classes: 10
  val_fraction: 0.1
  split_seed: 0
  noise:
    type: pair
    rate: 0.1
    pairs:
    - - 1
      - 7
    - - 4
      - 9
    - - 3
      - 8
    seed: 0
model:
  name: small_cnn
  in_channels: 1
  feature_dim: 128
head:
  name: linear
train:
  epochs: 15
  batch_size: 128
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  label_smoothing: 0.1
