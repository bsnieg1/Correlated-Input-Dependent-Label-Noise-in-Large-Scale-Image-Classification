# S3: negative control, 30% symmetric noise; method ls. Generated by make_mnist_configs.py.
experiment: mnist_s3_p30_ls
method: ls
data:
  name: mnist
  root: data
  num_classes: 10
  val_fraction: 0.1
  split_seed: 0
  noise:
    type: symmetric
    rate: 0.3
    seed: 0
model:
  name: small_cnn
  in_channels: 1
  feature_dim: 128
head:
  name: linear
train:
  epochs: 15
  batch_size: 128
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  label_smoothing: 0.1
