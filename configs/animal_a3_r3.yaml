# A3: ablation on A1, R = 3. Generated by make_animal_configs.py.
experiment: animal_a3_r3
method: het
data:
  name: animal10n
  root: data/animal10n
  num_classes: 10
  val_fraction: 0.1
  split_seed: 0
  crop_padding: 4
model:
  name: resnet18_small
  in_channels: 3
head:
  name: het
  num_factors: 3
  temperature: 1.0
  num_samples: 1000
train:
  epochs: 100
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  amp: true
  eval_batch_size: 500
