# A1: original ANIMAL-10N labels (real noise ~8%); method het_diag. Generated by make_animal_configs.py.
experiment: animal_a1_het_diag
method: het_diag
data:
  name: animal10n
  root: data/animal10n
  num_classes: 10
  val_fraction: 0.1
  split_seed: 0
  crop_padding: 4
model:
  name: resnet18_small
  in_channels: 3
head:
  name: het_diag
  temperature: 1.0
  num_samples: 1000
train:
  epochs: 100
  batch_size: 128
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  amp: true
  eval_batch_size: 500
